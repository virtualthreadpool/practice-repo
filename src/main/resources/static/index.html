<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            margin:40px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        tr:hover{
            background:#d6eaff;
        }

        button{
            padding:8px 15px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            color:white;
        }

        .edit{
            background:green;
        }

        .delete{
            background:red;
        }
    </style>
</head>
<body>

<h1>Product List</h1>

<table id="productTable">
    <thead>
    <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>

    </tbody>

</table>

<script>

    fetch("http://localhost:8080/products")
        .then(response => response.json())
        .then(data => {

            let table = document.querySelector("#productTable tbody");

            data.forEach(product => {

                let row = `
        <tr>
            <td>${product.productId}</td>
            <td>${product.productName}</td>
            <td>${product.category}</td>
            <td>₹${product.price}</td>
            <td>${product.quantity}</td>

            <td>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            </td>

        </tr>
        `;

                table.innerHTML += row;

            });

        })
        .catch(error => console.log(error));

</script>

</body>
</html>
